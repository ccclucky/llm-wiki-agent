name: Skill suite tests

on:
  push:
    branches: ["main", "feat/**", "refactor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests
      - name: Run Skill suite contract and packaging tests
        run: python -m unittest discover -s tests -v
      - name: Build all WorkBuddy Skill packages
        run: python scripts/package_workbuddy_skill.py --output-dir "$RUNNER_TEMP/cclucky-skill-packages"
      - name: Upload WorkBuddy Skill packages
        uses: actions/upload-artifact@v4
        with:
          name: cclucky-knowledge-skills-workbuddy
          path: ${{ runner.temp }}/cclucky-skill-packages/*.zip
          if-no-files-found: error
          retention-days: 14
